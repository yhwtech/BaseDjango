{% extends "base.html" %}

{% block content %}
  <h1>Gestionar permisos</h1>
  <div class="container">
      <div class="row">
          <div class="col-11">
              <form method="POST" id="gestion-group-form">
                    {% csrf_token %}
                    <div class="field-select big-select">
                      <label for="group_selection">Grupo</label>
                      <select id="group_selection" name="group_selected">
                          {% for group in groups %}
                            <option value="{{group.name}}">{{group.name}}</option>
                          {% endfor %}
                      </select>
                    </div>

                    <div class="d-flex justify-content-center">
                      <button class="btn secondary" type="submit" form="gestion-group-form">Seleccionar grupo</button>
                    </div>
              </form>
          </div>
          <div class="col-1">
                 <div class="d-flex justify-content-center my-3">
                          <button id="btn-modal-app" class="btn primary" type="button">+</button>
                 </div>
          </div>
      </div>

      <div id="modal-app">
          <div class="modal-app-content">
              <form method="POST" id="create-group-form">
              {% csrf_token %}
              <div class="field-input my-3">
                  <label for="new_group_name">Nuevo Grupo</label>
                  <input type="text" id="new_group_name" name="new_group_name" required placeholder="Nombre del nuevo grupo">
              </div>

              <div class="d-flex justify-content-center my-4">
                   <button class="btn primary" type="submit" form="create-group-form">Crear nuevo grupo</button>
                   <button id="btn-close-modal-app"  class="btn cancel" type="button">Cancelar</button>
              </div>
        </form>
          </div>
      </div>

  </div>

<script>
    const btnModalCreateGroup = document.getElementById('btn-modal-app');
    const modalCreateGroup = document.getElementById('modal-app');
    const closeModalCreateGroup = document.getElementById('btn-close-modal-app');

    btnModalCreateGroup.addEventListener('click', () => {
        modalCreateGroup.style.display = 'block';
    });

    closeModalCreateGroup.addEventListener('click', () => {
        modalCreateGroup.style.display = 'none';
    });

</script>
{% endblock %}
