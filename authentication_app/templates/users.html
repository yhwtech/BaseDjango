{% extends "base.html" %}

{% block content %}
  <h1>Gestionar usuarios</h1>
  <div class="container">
       <form method="POST">
       {% csrf_token %}
           <div class="field-select big-select">
              <label for="client_selection">Cliente</label>
              <select id="client_selection" name="client_selected">
                  {% for client in clients %}
                    <option value="{{client.schema_name}}">{{client.name}}</option>
                  {% endfor %}
              </select>
           </div>

          <div class="d-flex justify-content-center">
              <button class="btn secondary" type="submit">Seleccionar Cliente</button>
          </div>
  </form>
  </div>


{% endblock %}
